<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Словарь с Картинками</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { text-align: center; color: #2c3e50; }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            align-items: center;
        }
        
        button, input[type="file"]::file-selector-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover, input[type="file"]::file-selector-button:hover { background-color: #2980b9; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-secondary { background-color: #95a5a6; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .actions { display: flex; gap: 10px; flex-direction: column; }
        
        /* Стили для картинок в таблице */
        .word-image {
            max-width: 100px;
            max-height: 100px;
            border-radius: 5px;
            object-fit: cover;
            border: 1px solid #ddd;
        }
        .no-image { color: #999; font-style: italic; font-size: 12px; }

        /* Всплывающее окно (Модалка) */
        .modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
        }
        .modal {
            background: white; padding: 25px; border-radius: 8px;
            width: 350px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal h2 { margin: 0 0 10px 0; font-size: 20px; }
        .modal input[type="text"] {
            padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Мой Словарь</h1>

    <div class="controls">
        <div>
            <label>Загрузить словарь (JSON): </label>
            <input type="file" id="fileInput" accept=".json">
        </div>
        <div>
            <button class="btn-success" onclick="openModal()">+ Добавить слово</button>
            <button onclick="downloadDictionary()">Скачать словарь</button>
            <button class="btn-danger" onclick="clearDictionary()">Очистить всё</button>
        </div>
    </div>

    <table id="dictionaryTable">
        <thead>
            <tr>
                <th>Картинка</th>
                <th>Слово (Термин)</th>
                <th>Перевод (Значение)</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Слова -->
        </tbody>
    </table>

    <!-- Всплывающее окно добавления/редактирования -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Добавить слово</h2>
            <input type="text" id="termInput" placeholder="Введите слово...">
            <input type="text" id="defInput" placeholder="Введите перевод...">
            <label style="font-size: 12px; color: #555;">Картинка (необязательно):</label>
            <input type="file" id="imageInput" accept="image/*">
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn-success" onclick="saveWord()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        let dictionary = [];
        let editingIndex = -1; // -1 значит создаем новое слово, иначе редактируем

        // Загрузка при открытии
        window.onload = () => {
            const savedData = localStorage.getItem('myDictWithImages');
            if (savedData) {
                dictionary = JSON.parse(savedData);
                renderTable();
            }
        };

        function saveToLocal() {
            try {
                localStorage.setItem('myDictWithImages', JSON.stringify(dictionary));
            } catch (e) {
                alert("Ошибка сохранения! Возможно, вы добавили слишком много больших картинок. Память браузера переполнена.");
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            dictionary.forEach((item, index) => {
                const tr = document.createElement('tr');
                
                // Проверяем, есть ли картинка
                const imgHtml = item.image 
                    ? `<img src="${item.image}" class="word-image" alt="img">` 
                    : `<span class="no-image">Нет картинки</span>`;

                tr.innerHTML = `
                    <td>${imgHtml}</td>
                    <td><strong>${item.term}</strong></td>
                    <td>${item.definition}</td>
                    <td class="actions">
                        <button onclick="openModal(${index})">Изменить</button>
                        <button class="btn-danger" onclick="deleteWord(${index})">Удалить</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            saveToLocal();
        }

        // Управление модальным окном
        function openModal(index = -1) {
            editingIndex = index;
            const title = document.getElementById('modalTitle');
            const termInp = document.getElementById('termInput');
            const defInp = document.getElementById('defInput');
            const imgInp = document.getElementById('imageInput');

            imgInp.value = ''; // Сбрасываем файл

            if (index >= 0) {
                title.innerText = "Изменить слово";
                termInp.value = dictionary[index].term;
                defInp.value = dictionary[index].definition;
            } else {
                title.innerText = "Добавить слово";
                termInp.value = '';
                defInp.value = '';
            }

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        // Сохранение слова (с обработкой картинки)
        function saveWord() {
            const term = document.getElementById('termInput').value.trim();
            const definition = document.getElementById('defInput').value.trim();
            const fileInput = document.getElementById('imageInput');
            
            if (!term || !definition) {
                alert("Заполните слово и перевод!");
                return;
            }

            const file = fileInput.files[0];

            if (file) {
                // Если пользователь выбрал картинку
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    finalizeSave(term, definition, base64Image);
                };
                reader.readAsDataURL(file);
            } else {
                // Если картинку не выбрали
                let existingImage = null;
                if (editingIndex >= 0 && dictionary[editingIndex].image) {
                    existingImage = dictionary[editingIndex].image; // Оставляем старую картинку
                }
                finalizeSave(term, definition, existingImage);
            }
        }

        function finalizeSave(term, definition, image) {
            if (editingIndex >= 0) {
                dictionary[editingIndex] = { term, definition, image };
            } else {
                dictionary.push({ term, definition, image });
            }
            closeModal();
            renderTable();
        }

        function deleteWord(index) {
            if (confirm("Точно удалить это слово?")) {
                dictionary.splice(index, 1);
                renderTable();
            }
        }

        function clearDictionary() {
            if (confirm("Вы уверены, что хотите удалить ВСЕ слова?")) {
                dictionary = [];
                renderTable();
            }
        }

        // Загрузка JSON
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    dictionary = json;
                    renderTable();
                    alert("Словарь успешно загружен!");
                } catch (error) {
                    alert("Ошибка чтения файла. Убедитесь, что это корректный JSON.");
                }
            };
            reader.readAsText(file);
        });

        // Скачивание JSON
        function downloadDictionary() {
            if (dictionary.length === 0) {
                alert("Словарь пуст, нечего скачивать.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dictionary, null, 4));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "dictionary_with_images.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
    </script>
</body>
</html>
